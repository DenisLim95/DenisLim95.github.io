<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Denis Federico Manuel Lim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <nav>
        <a href="index.html" class="site-title">Denis Federico Manuel Lim</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="projects.html" class="active">Projects</a>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">☀️</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Projects</h1>
        </header>

        <div class="projects-grid">
            <a href="projects/bluedot-puzzle.html" class="project-card">
                <div class="project-card-image">
                    <img src="https://raw.githubusercontent.com/DenisLim95/nonlinear-feature-geometry-bluedot-puzzle/main/3d-pca.png" alt="BlueDot Technical AI Safety Puzzle">
                </div>
                <h3 class="project-card-title">BlueDot Technical AI Safety Puzzle</h3>
            </a>

            <a href="projects/trust-the-kernel.html" class="project-card">
                <div class="project-card-image placeholder">
                </div>
                <h3 class="project-card-title">Trust the kernel</h3>
            </a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleButton(newTheme);
        }

        function updateToggleButton(theme) {
            const button = document.querySelector('.theme-toggle');
            if (button) button.textContent = theme === 'dark' ? '🌙' : '☀️';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            updateToggleButton(savedTheme);
        });
    </script>
</body>
</html>
